services:
  mongodb:
    image: mongo:latest
    container_name: storyflow_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: storyflow_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/storyflow
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: storyflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data:
